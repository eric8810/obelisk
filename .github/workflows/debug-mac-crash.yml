name: Debug macOS crash

on:
  workflow_dispatch:

jobs:
  run-mac-binary:
    name: Build and run obelisk-app on a macOS runner
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: obelisk-v0.4.0

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build both arches
        run: |
          cargo build --release -p obelisk-app --target aarch64-apple-darwin
          cargo build --release -p obelisk-app --target x86_64-apple-darwin

      - name: Run arm64 binary
        run: |
          set +e
          RUST_BACKTRACE=1 target/aarch64-apple-darwin/release/obelisk-app > arm.log 2>&1 &
          PID=$!
          sleep 12
          if kill -0 $PID 2>/dev/null; then
            echo "=== arm64 STILL RUNNING after 12s ==="
            kill $PID || true
          else
            wait $PID
            echo "=== arm64 EXITED code $? ==="
          fi
          cat arm.log

      - name: Run x86_64 binary (Rosetta)
        run: |
          set +e
          RUST_BACKTRACE=1 target/x86_64-apple-darwin/release/obelisk-app > x64.log 2>&1 &
          PID=$!
          sleep 12
          if kill -0 $PID 2>/dev/null; then
            echo "=== x86_64 STILL RUNNING after 12s ==="
            kill $PID || true
          else
            wait $PID
            echo "=== x86_64 EXITED code $? ==="
          fi
          cat x64.log

      - name: Check for crash reports
        if: always()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/obelisk*.ips; do
            [ -f "$f" ] && echo "=== $f ===" && head -80 "$f"
          done
          exit 0
