name: Debug macOS crash

on:
  workflow_dispatch:

jobs:
  run-mac-binary:
    name: Reproduce the double-click (LaunchServices) launch path
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2

      - name: Build the app
        run: cargo build --release -p obelisk-app

      - name: Bundle as Obelisk.app (same as release-rust.yml)
        run: |
          BIN=target/release/obelisk-app
          strip "$BIN" || true
          APP=Obelisk.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/obelisk-app"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>Obelisk</string>
            <key>CFBundleDisplayName</key>       <string>Obelisk</string>
            <key>CFBundleExecutable</key>        <string>obelisk-app</string>
            <key>CFBundleIdentifier</key>        <string>io.github.eric8810.obelisk</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.4.1</string>
            <key>CFBundleVersion</key>           <string>0.4.1</string>
            <key>LSMinimumSystemVersion</key>    <string>11.0</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>LSUIElement</key>               <false/>
          </dict>
          </plist>
          EOF
          codesign --force --sign - "$APP"
          echo "bundle ready"

      # Post-"Allow Anyway" state: quarantine attribute removed (this is what
      # the user's machine does after they approve the app), then a real
      # LaunchServices launch — the exact double-click path.
      - name: Launch via LaunchServices (post Allow-Anyway)
        run: |
          set +e
          timeout 30 open Obelisk.app --stdout /tmp/open-out.log --stderr /tmp/open-err.log
          echo "open rc=$?"
          sleep 15
          echo "=== process ==="
          pgrep -fl obelisk-app || echo "no process"
          echo "=== app stdout ==="
          cat /tmp/open-out.log 2>/dev/null
          echo "=== app stderr ==="
          cat /tmp/open-err.log 2>/dev/null
          echo "=== windows (System Events, 10s cap) ==="
          timeout 10 osascript -e 'tell application "System Events" to tell process "obelisk-app" to get name of every window' 2>&1
          echo "=== lsappinfo ==="
          timeout 10 lsappinfo info -only ApplicationType,LSUIElement io.github.eric8810.obelisk 2>&1 | head -5
          echo "=== screen capture ==="
          timeout 15 screencapture -x /tmp/screen-clean.png && echo captured
          mkdir -p artifacts && cp /tmp/screen-clean.png artifacts/ 2>/dev/null

      # Same launch with quarantine still attached (pre-approval). `open` may
      # block on the Gatekeeper decision in an unattended session, hence the
      # timeout wrapper; we only record what happens.
      - name: Launch with quarantine (pre-approval, observed only)
        if: always()
        run: |
          set +e
          timeout 20 pkill -f obelisk-app; sleep 2
          xattr -w com.apple.quarantine "0081;66f00000;Safari;FB50F48F-1E4E-43B9-A8C5-7C4B1E9C21A5" Obelisk.app
          timeout 60 open Obelisk.app --stdout /tmp/q-out.log --stderr /tmp/q-err.log
          echo "open rc=$?"
          sleep 10
          echo "=== process (quarantine) ==="
          pgrep -fl obelisk-app || echo "no process"
          echo "=== app stdout (quarantine) ==="
          cat /tmp/q-out.log 2>/dev/null
          echo "=== app stderr (quarantine) ==="
          cat /tmp/q-err.log 2>/dev/null
          timeout 15 screencapture -x /tmp/screen-quarantine.png && cp /tmp/screen-quarantine.png artifacts/ 2>/dev/null

      - name: Check for crash reports
        if: always()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/obelisk*.ips; do
            [ -f "$f" ] && echo "=== $f ===" && head -80 "$f"
          done
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-launch-repro
          path: artifacts/
