name: Debug macOS crash

on:
  workflow_dispatch:

jobs:
  run-mac-binary:
    name: Build and run obelisk-app on a macOS runner
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: obelisk-v0.4.0

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build the app
        run: cargo build --release -p obelisk-app

      # Run the freshly built binary directly for 12s; a panic prints its
      # message + backtrace to stderr, which we capture verbatim.
      - name: Run binary and capture output
        run: |
          set +e
          BIN=target/release/obelisk-app
          RUST_BACKTRACE=1 "$BIN" > run.log 2>&1 &
          PID=$!
          sleep 12
          if kill -0 $PID 2>/dev/null; then
            echo "=== STILL RUNNING after 12s (no immediate crash) ==="
            kill $PID || true
          else
            wait $PID
            echo "=== PROCESS EXITED with code $? ==="
          fi
          echo "===== captured output ====="
          cat run.log
          echo "===== end ====="

      - name: Check for crash reports
        if: always()
        run: |
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -5 || echo "no diagnostic reports"
          for f in ~/Library/Logs/DiagnosticReports/obelisk*.ips; do
            [ -f "$f" ] && echo "=== $f ===" && head -80 "$f"
          done
          exit 0
