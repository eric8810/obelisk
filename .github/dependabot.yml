version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      # The toolchain pin must stay in lockstep with rust-toolchain.toml;
      # bump it manually with the file (dependabot picks a nonexistent Rust
      # version tag and breaks CI).
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'
    ignore:
      # typescript-eslint (any 8.x) peer-requires typescript <6.1.0; a TS
      # major bump breaks `npm ci` (the Publish Skill workflow). Lift this
      # only when typescript-eslint supports the newer major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
