version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      # The toolchain pin must stay in lockstep with rust-toolchain.toml;
      # bump it manually with the file (dependabot picks a nonexistent Rust
      # version tag and breaks CI).
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'
