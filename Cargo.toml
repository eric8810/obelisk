[workspace]
resolver = "2"
members = ["crates/obelisk-core", "crates/obelisk-cli", "crates/obelisk-app"]

[workspace.package]
version = "0.4.3"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/eric8810/obelisk"
rust-version = "1.85"

[workspace.dependencies]
obelisk-core = { path = "crates/obelisk-core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rquickjs = { version = "0.13", features = ["full-async", "parallel"] }
notify = "8"
zstd = "0.14"
chrono = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
# fc-ui 0.8.1's code-block tokenizer slices lines at byte offsets, which
# panics on any multi-byte UTF-8 content (CJK notes inside code blocks — the
# v0.4.1 macOS launch crash). Vendored with a char-boundary-safe fix until
# an upstream release carries it.
fc-ui = { path = "vendor/fc-ui" }
# fc-gpui-linux 0.9.0's X11 backend skips wheel events flagged
# POINTER_EMULATED on the assumption that a smooth valuator motion event
# follows. XWayland (any Wayland compositor hosting X11 apps) delivers the
# wheel ONLY as emulated button presses, so scrolling was completely dead
# there — the single biggest reason the app felt unusable with a real mouse.
# Vendored with a dispatch-dedupe fix (see the patch comments in
# vendor/fc-gpui-linux/src/linux/x11/client.rs) until an upstream release
# carries it.
fc-gpui-linux = { path = "vendor/fc-gpui-linux" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
